name: CI

# Pushes to main deploy straight to production on Vercel, so this is the only
# thing standing between a bad commit and the live site. It deliberately runs
# the simulation smoke test as well as the usual static checks: the regressions
# this project has actually shipped were balance and gameplay bugs that
# typecheck and lint could never have caught.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version the Vercel project builds with.
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: MITRE mapping consistency
        # Offline: checks src/game/data/attack.ts against the committed snapshot
        # of the ATT&CK Adventure dataset. Refreshing the snapshot needs that
        # repo checked out and is done with `npm run attack:sync` locally.
        run: npm run attack:check

      - name: Economy pressure
        # Fails if any campaign's late game is trivial (nothing left to buy) or
        # unwinnable. Playtesting found the former; nothing automated caught it.
        run: npm run economy

      - name: Simulation smoke test
        run: npm run simulate

      - name: Leaderboard submission bounds
        run: npm run leaderboard

      - name: Production build
        # A throwaway value: the build only needs *a* secret to be present, and
        # no real credential should ever be required to compile this project.
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
        run: npm run build
